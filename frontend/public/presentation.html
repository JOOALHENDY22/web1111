            <div class="border-b border-slate-800 pb-2 flex items-center justify-between">
              <div>
                <span class="text-xs text-teal-400 font-bold uppercase tracking-wider">${slideData.slideTag}</span>

            <p class="text-xs sm:text-sm text-slate-300 font-medium">${slideData.desc}</p>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
              ${slideData.callouts.map(c => `
                <div class="p-3.5 sm:p-4 rounded-xl bg-slate-900 border border-slate-800 space-y-1.5 shadow-sm">
                  <span class="text-xs sm:text-sm font-bold text-teal-300 block">${c.title}</span>
                  <p class="text-xs text-slate-300 font-medium leading-relaxed">${c.desc}</p>
                </div>

          </div>
        `;
      }

      if (slideData.type === 'six_tools') {
        return `
          <div class="slide active w-full h-full flex flex-col justify-center space-y-4 ${textDir}">
            <div class="border-b border-slate-800 pb-2">
              <span class="text-xs text-teal-400 font-bold uppercase tracking-wider">${slideData.slideTag}</span>
              <h2 class="text-xl sm:text-3xl font-black text-white mt-0.5">${slideData.slideTitle}</h2>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5">
              ${slideData.tools.map(t => `
                <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800 space-y-1.5 shadow-sm">
                  <span class="text-xs sm:text-sm font-extrabold text-teal-300 block">${t.icon} ${t.title}</span>
                  <p class="text-xs sm:text-sm text-slate-300 leading-relaxed font-medium">${t.desc}</p>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      if (slideData.type === 'clinical_case') {
        return `
          <div class="slide active w-full h-full flex flex-col justify-center space-y-4 ${textDir}">
            <div class="border-b border-slate-800 pb-2 flex items-center justify-between">
              <div>
                <span class="text-xs text-teal-400 font-bold uppercase tracking-wider">${slideData.slideTag}</span>
                <h2 class="text-xl sm:text-3xl font-black text-white mt-0.5">${slideData.slideTitle}</h2>
              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-stretch">
              <div class="lg:col-span-4 p-5 rounded-2xl bg-slate-900 border border-slate-800 space-y-3 shadow-md">
                <span class="text-xs font-bold text-teal-400 block uppercase tracking-wider">Patient Profile & Regimen:</span>
                <p class="text-xs sm:text-sm text-slate-200 font-bold">${slideData.patientProfile}</p>
                <div class="pt-2 border-t border-slate-800 space-y-1.5">
                  <span class="text-xs text-slate-400 font-bold block">Prescribed Drugs:</span>
                  ${slideData.rxDrugs.map(d => `<div class="text-xs font-bold text-teal-300 bg-slate-950 p-2 rounded-lg border border-slate-800">• ${d}</div>`).join('')}
                </div>
              </div>

              <div class="lg:col-span-8 p-5 rounded-2xl bg-slate-950 border border-slate-800 space-y-3 shadow-md">
                <span class="text-xs sm:text-sm font-bold text-white block">Triage Engine Findings:</span>
                <div class="space-y-2">
                  ${slideData.findings.map(f => `
                    <div class="p-3.5 rounded-xl bg-slate-900 border border-slate-800 space-y-1">
                      <span class="text-xs font-bold text-teal-400 block uppercase">${f.badge}</span>
                      <span class="text-xs sm:text-sm font-bold text-white block">${f.title}</span>
                      <p class="text-xs text-slate-300 font-medium">${f.desc}</p>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          </div>
        `;
      }

      if (slideData.type === 'egypt_value') {
        return `
          <div class="slide active w-full h-full flex flex-col justify-center space-y-4 ${textDir}">
            <div class="border-b border-slate-800 pb-2">
              <span class="text-xs text-teal-400 font-bold uppercase tracking-wider">${slideData.slideTag}</span>
              <h2 class="text-xl sm:text-3xl font-black text-white mt-0.5">${slideData.slideTitle}</h2>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              ${slideData.values.map(v => `
                <div class="p-5 rounded-2xl bg-slate-900 border border-slate-800 space-y-2 shadow-sm">
                  <span class="text-2xl font-black text-teal-400 font-mono">${v.num}</span>
                  <h4 class="text-sm sm:text-base font-extrabold text-white">${v.title}</h4>
                  <p class="text-xs sm:text-sm text-slate-300 leading-relaxed font-medium">${v.desc}</p>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      if (slideData.type === 'tech_arch') {
        return `
          <div class="slide active w-full h-full flex flex-col justify-center space-y-4 ${textDir}">
            <div class="border-b border-slate-800 pb-2">
              <span class="text-xs text-teal-400 font-bold uppercase tracking-wider">${slideData.slideTag}</span>
              <h2 class="text-xl sm:text-3xl font-black text-white mt-0.5">${slideData.slideTitle}</h2>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-6 gap-2.5 text-center">
              ${slideData.pipeline.map(p => `
                <div class="p-3 sm:p-4 rounded-xl bg-slate-900 border border-slate-800 space-y-1 shadow-sm">
                  <span class="text-xs sm:text-sm font-bold text-teal-400 block">${p.step}</span>
                  <span class="text-[11px] text-slate-300 block">${p.desc}</span>
                </div>
              `).join('')}
            </div>

            <div class="p-5 rounded-2xl bg-slate-900 border border-slate-800 space-y-2 text-xs sm:text-sm text-slate-300 leading-relaxed font-medium">
              ${slideData.notes.map(n => `<p>${n}</p>`).join('')}
            </div>
          </div>
        `;
      }

      if (slideData.type === 'impact_grid') {
        return `
          <div class="slide active w-full h-full flex flex-col justify-center space-y-4 ${textDir}">
            <div class="border-b border-slate-800 pb-2">
              <span class="text-xs text-teal-400 font-bold uppercase tracking-wider">${slideData.slideTag}</span>
              <h2 class="text-xl sm:text-3xl font-black text-white mt-0.5">${slideData.slideTitle}</h2>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              ${slideData.impacts.map(im => `
                <div class="p-5 rounded-2xl bg-slate-900 border border-slate-800 space-y-2 shadow-sm">
                  <span class="text-sm sm:text-base font-extrabold text-teal-300 block">${im.icon} ${im.title}</span>
                  <p class="text-xs sm:text-sm text-slate-300 leading-relaxed font-medium">${im.desc}</p>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      if (slideData.type === 'final_cta') {
        return `
          <div class="slide active w-full h-full flex flex-col justify-center items-center text-center space-y-6">
            <div class="inline-flex items-center gap-2 px-5 py-2 rounded-full bg-teal-950 border border-teal-700 text-teal-300 text-xs sm:text-sm font-bold shadow-md">
              <span>🏆 ${slideData.slideTag}</span>
            </div>

            <h2 class="text-4xl sm:text-6xl font-black text-white tracking-tight">
              ${slideData.title}
            </h2>

            <p class="text-lg sm:text-2xl text-teal-200 font-bold italic max-w-2xl">
              ${slideData.motto}
            </p>

            <div class="p-5 sm:p-6 rounded-2xl bg-slate-900/95 border border-slate-800 max-w-xl w-full ${textDir} space-y-3 text-xs sm:text-sm font-medium shadow-md">
              <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                <span class="text-slate-400">Team:</span>
                <span class="font-bold text-white">${slideData.team}</span>
              </div>
              <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                <span class="text-slate-400">Developer:</span>
                <span class="font-bold text-white">${slideData.lead}</span>
              </div>
              <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                <span class="text-slate-400">Institution:</span>
                <span class="font-bold text-teal-400">${slideData.institution}</span>
              </div>
              <div class="flex items-center justify-between pt-1">
                <span class="text-slate-400">Live URL:</span>
                <a href="${slideData.liveUrl}" target="_blank" class="font-bold text-teal-300 hover:underline">web1111-three.vercel.app</a>
              </div>
            </div>
          </div>
        `;
      }

      return `<div>Slide</div>`;
    }

    function renderCurrentSlide() {
      const data = deckData[currentLang];
      const slide = data.slides[currentSlide];
      
      // Update Canvas
      document.getElementById('slideCanvas').innerHTML = renderSlide(slide, currentLang);
      
      // Update UI Header & Footer labels
      document.getElementById('headerSub').textContent = data.headerSub;
      document.getElementById('langBtnText').textContent = data.langBtn;
      document.getElementById('downloadBtnText').textContent = data.downloadBtn;
      document.getElementById('prevBtnText').textContent = data.prevBtn;
      document.getElementById('nextBtnText').textContent = data.nextBtn;

      // Update Slide Counter
      document.getElementById('slideCounter').textContent = `${currentSlide + 1} / ${data.slides.length}`;

      // Update Dots
      const dotsContainer = document.getElementById('dotsContainer');
      dotsContainer.innerHTML = data.slides.map((_, i) => `
        <button class="dot w-3 h-3 rounded-full shrink-0 transition-all ${i === currentSlide ? 'bg-teal-400 scale-125' : 'bg-slate-700'}" onclick="goToSlide(${i})"></button>
      `).join('');

      // Buttons State
      document.getElementById('prevBtn').disabled = currentSlide === 0;
      document.getElementById('nextBtn').disabled = currentSlide === data.slides.length - 1;
    }

    function nextSlide() {
      const data = deckData[currentLang];
      if (currentSlide < data.slides.length - 1) {
        currentSlide++;
        renderCurrentSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderCurrentSlide();
      }
    }

    function goToSlide(index) {
      currentSlide = index;
      renderCurrentSlide();
    }

    document.getElementById('nextBtn').addEventListener('click', nextSlide);
    document.getElementById('prevBtn').addEventListener('click', prevSlide);

    document.getElementById('langToggleBtn').addEventListener('click', () => {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      const root = document.getElementById('htmlRoot');
      if (currentLang === 'ar') {
        root.setAttribute('dir', 'rtl');
        root.setAttribute('lang', 'ar');
      } else {
        root.setAttribute('dir', 'ltr');
        root.setAttribute('lang', 'en');
      }
      renderCurrentSlide();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown') {
        if (currentLang === 'ar') prevSlide(); else nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp' || e.key === ' ') {
        if (currentLang === 'ar') nextSlide(); else prevSlide();
      }
    });

    // Initial Render
    renderCurrentSlide();
  </script>
</body>
</html>
