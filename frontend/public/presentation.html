    function renderPresentation() {
      const data = presentationData[currentLang];
      const slide = data.slides[currentSlide];

      document.getElementById('slideCanvas').innerHTML = buildSlideHTML(slide, currentLang);
      document.getElementById('headerSub').textContent = data.headerSub;
      document.getElementById('langBtnText').textContent = data.langBtn;
      document.getElementById('downloadBtnText').textContent = data.downloadBtn;
      document.getElementById('prevBtnText').textContent = data.prevBtn;
      document.getElementById('nextBtnText').textContent = data.nextBtn;

      document.getElementById('slideCounter').textContent = `${currentSlide + 1} / ${data.slides.length}`;

      const dotsContainer = document.getElementById('dotsContainer');
      dotsContainer.innerHTML = data.slides.map((_, i) => `
        <button class="dot w-2 sm:w-3 h-2 sm:h-3 rounded-full shrink-0 transition-all ${i === currentSlide ? 'bg-teal-400 scale-125' : 'bg-slate-700'}" onclick="goToSlide(${i})"></button>
      `).join('');

      document.getElementById('prevBtn').disabled = currentSlide === 0;
      document.getElementById('nextBtn').disabled = currentSlide === data.slides.length - 1;

      // Reset scroll position on slide change
      document.getElementById('slideCanvas').scrollTop = 0;
    }

    // TOUCH SWIPE DETECTION ENGINE FOR MOBILE
    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;

    const canvas = document.getElementById('slideCanvas');

    canvas.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    canvas.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      touchEndY = e.changedTouches[0].screenY;
      handleSwipeGesture();
    }, { passive: true });

    function handleSwipeGesture() {
      const deltaX = touchEndX - touchStartX;
      const deltaY = touchEndY - touchStartY;
      const minSwipeDistance = 45; // pixels

      // Only trigger horizontal slide swipe if horizontal movement is greater than vertical movement
      if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > minSwipeDistance) {
        if (currentLang === 'ar') {
          // RTL Swipe logic
          if (deltaX < 0) {
            nextSlide(); // Swiped left -> next
          } else {
            prevSlide(); // Swiped right -> prev
          }
        } else {
          // LTR Swipe logic
          if (deltaX < 0) {
            nextSlide();
          } else {
            prevSlide();
          }
        }
      }
    }

    // INTERACTIVE SANDBOX DEMO HANDLERS

      const isAr = currentLang === 'ar';

              <span class="font-bold text-teal-300 block text-xs">Concor 5mg</span>

          </div>

      }

    window.setInteractionDemo = function(pair) {

        res.innerHTML = `

      } else {
        res.innerHTML = `
          <span class="text-[9px] bg-red-600 text-white font-bold px-1.5 py-0.5 rounded uppercase">🔴 HIGH RISK (خطورة عالية)</span>
          <h5 class="text-xs font-extrabold text-white">Ciprofloxacin ↔ Antinal</h5>

    window.setFoodDemo = function(drug) {

      if (drug === 'glucophage') {
        res.innerHTML = `
          <div class="flex items-center justify-between">

            <span class="text-[9px] bg-emerald-950 border border-emerald-700 text-emerald-300 px-1.5 py-0.5 rounded font-bold">${isAr ? 'وسط الأكل' : 'With Food'}</span>

          </div>

            💡 <strong>${isAr ? 'نصيحة:' : 'Tip:'}</strong> ${isAr ? 'تثبيت موعد الجرعة لتنظيم الضغط 24 ساعة.' : 'Take consistently to maintain 24h BP control.'}

        res.innerHTML = `

    window.calculateVitalsDemo = function(val) {
      const isAr = currentLang === 'ar';
      const res = document.getElementById('vitalsDemoResult');
      if (!res) return;

      const n = parseFloat(val);
      if (n <= 1.2) {
        res.innerHTML = `
          <span class="font-bold text-emerald-400 block text-xs">🟢 ${isAr ? 'النتيجة: طبيعي (Normal)' : 'Status: Normal'}</span>
          <p class="text-[10px] text-slate-300">${isAr ? 'وظائف الكلى سليمة ولا تحتاج لتعديل جرعات.' : 'Normal renal function; standard dosing.'}</p>
        `;
        res.className = 'p-2 rounded-xl bg-emerald-950/40 border border-emerald-800 text-xs space-y-0.5';
      } else {
        res.innerHTML = `
          <span class="font-bold text-red-400 block text-xs">🔴 ${isAr ? 'النتيجة: مرتفع (High Alert)' : 'Status: Elevated (Renal Alert)'}</span>
          <p class="text-[10px] text-slate-300">${isAr ? 'يشير لانخفاض وظائف الكلى. يلزم تعديل جرعات المضادات ومسكنات NSAIDs.' : 'Indicates reduced renal function. Dose reduction required.'}</p>
        `;
        res.className = 'p-2 rounded-xl bg-red-950/40 border border-red-800 text-xs space-y-0.5';
      }
    };

    window.setChronicDemo = function(cond) {
      const isAr = currentLang === 'ar';
      const res = document.getElementById('chronicDemoResult');
      if (!res) return;

      if (cond === 'htn') {
        res.innerHTML = `
          <span class="font-bold text-amber-400 block text-[11px]">${isAr ? '🟠 تحذير وحذر شديد (Caution)' : '🟠 Caution Required'}</span>
          <p class="text-[10px] text-slate-300">
            ${isAr ? 'مسكنات NSAIDs ترفع ضغط الدم وتقلل فاعلية أدوية الضغط ACE/ARBs. لا يُستخدم لأكثر من 3 أيام.' : 'NSAIDs cause sodium retention, blunt antihypertensive therapy, and elevate systolic BP.'}
          </p>
        `;
      } else {
        res.innerHTML = `
          <span class="font-bold text-red-400 block text-[11px]">${isAr ? '🚫 ممنوع تماماً (Contraindicated)' : '🚫 Strictly Contraindicated'}</span>
          <p class="text-[10px] text-slate-300">
            ${isAr ? 'مسكنات NSAIDs تقلل تدفق الدم الكلوي وتفاقم القصور الكلوي. استبدله بالباراسيتامول (Panadol).' : 'NSAIDs reduce renal blood flow and precipitate acute renal failure. Substitute with Paracetamol.'}
          </p>
        `;
      }
    };

    function nextSlide() {
      const data = presentationData[currentLang];
      if (currentSlide < data.slides.length - 1) {
        currentSlide++;
        renderPresentation();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderPresentation();
      }
    }

    function goToSlide(index) {
      currentSlide = index;
      renderPresentation();
    }

    document.getElementById('nextBtn').addEventListener('click', nextSlide);
    document.getElementById('prevBtn').addEventListener('click', prevSlide);

    document.getElementById('langToggleBtn').addEventListener('click', () => {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      const root = document.getElementById('htmlRoot');
      if (currentLang === 'ar') {
        root.setAttribute('dir', 'rtl');
        root.setAttribute('lang', 'ar');
      } else {
        root.setAttribute('dir', 'ltr');
        root.setAttribute('lang', 'en');
      }
      renderPresentation();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown') {
        if (currentLang === 'ar') prevSlide(); else nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp' || e.key === ' ') {
        if (currentLang === 'ar') nextSlide(); else prevSlide();
      }
    });

    renderPresentation();
  </script>
