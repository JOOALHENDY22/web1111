              <a href="${slide.route}" target="_blank" class="text-xs bg-teal-600 hover:bg-teal-500 text-white font-bold px-3.5 py-1.5 rounded-xl transition-all flex items-center gap-1.5 shadow-sm">
                <span>${slide.routeLabel}</span>
              </a>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-stretch">
              <!-- Left: Problem & Solution Explanation -->
              <div class="lg:col-span-6 p-4 sm:p-5 rounded-2xl bg-slate-900 border border-slate-800 flex flex-col justify-between space-y-3 shadow-md">
                <div class="space-y-2">
                  <span class="text-xs sm:text-sm font-bold text-red-400 block uppercase">${slide.problemTitle}</span>
                  <p class="text-xs sm:text-sm text-slate-200 leading-relaxed font-medium">${slide.problemDesc}</p>
                </div>

                <div class="space-y-2 pt-2.5 border-t border-slate-800">
                  <span class="text-xs sm:text-sm font-bold text-teal-400 block uppercase">${slide.solutionTitle}</span>
                  <p class="text-xs sm:text-sm text-slate-200 leading-relaxed font-medium">${slide.solutionDesc}</p>
                </div>

                <a href="${slide.route}" target="_blank" class="w-full text-center py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-teal-300 font-bold text-xs border border-teal-700/60 transition-colors block">
                  ${tryLiveBtnText}
                </a>
              </div>

              <!-- Right: Live Interactive Sandbox -->
              <div class="lg:col-span-6 p-4 sm:p-5 rounded-2xl bg-slate-950 border border-slate-800 flex flex-col justify-between space-y-2.5 shadow-md">
                <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                  <span class="text-xs font-bold text-teal-300 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span>${isAr ? 'تجربة تفاعلية مباشرة داخل العرض:' : 'Live Interactive Demo Sandbox:'}</span>
                  </span>
                  <span class="text-[10px] text-slate-400 font-mono">Route: ${slide.route}</span>
                </div>

                ${getInteractiveSandbox(slide.interactiveType, lang)}

                <div class="text-[10px] text-slate-400 text-center pt-1 border-t border-slate-900">
                  ${isAr ? 'مربوط مباشرة بقاعدة بيانات ومنطق الموقع' : 'Directly bound to live platform data logic'}
                </div>
              </div>
            </div>
          </div>
        `;
      }

      if (slide.type === 'clinical_case') {
        return `
          <div class="slide active w-full h-full flex flex-col justify-center space-y-4 ${textDir}">
            <div class="border-b border-slate-800 pb-2 flex items-center justify-between">
              <div>
                <span class="text-xs text-teal-400 font-bold uppercase tracking-wider">${slide.tag}</span>
                <h2 class="text-xl sm:text-2xl font-black text-white mt-0.5">${slide.title}</h2>
              </div>
            </div>

            <div class="p-4 rounded-xl bg-slate-900 border border-slate-800 text-xs sm:text-sm text-slate-200 font-bold">
              👤 ${slide.profile}
            </div>

            <div class="space-y-2.5">
              ${slide.findings.map(f => `
                <div class="p-4 rounded-xl bg-slate-900 border border-slate-800 space-y-1 text-xs sm:text-sm">
                  <span class="font-extrabold text-teal-300 block">${f.badge}</span>
                  <p class="text-slate-300 font-medium">${f.desc}</p>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      if (slide.type === 'final_cta') {
        return `
          <div class="slide active w-full h-full flex flex-col justify-center items-center text-center space-y-6">
            <div class="inline-flex items-center gap-2 px-5 py-2 rounded-full bg-teal-950 border border-teal-700 text-teal-300 text-xs sm:text-sm font-bold shadow-md">
              <span>🏆 ${slide.tag}</span>
            </div>

            <h2 class="text-4xl sm:text-6xl font-black text-white tracking-tight">
              ${slide.title}
            </h2>

            <p class="text-lg sm:text-2xl text-teal-200 font-bold italic max-w-2xl">
              ${slide.motto}
            </p>

            <div class="p-5 sm:p-6 rounded-2xl bg-slate-900/95 border border-slate-800 max-w-xl w-full ${textDir} space-y-3 text-xs sm:text-sm font-medium shadow-md">
              <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                <span class="text-slate-400">Team:</span>
                <span class="font-bold text-white">${slide.team}</span>
              </div>
              <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                <span class="text-slate-400">Developer:</span>
                <span class="font-bold text-white">${slide.lead}</span>
              </div>
              <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                <span class="text-slate-400">Institution:</span>
                <span class="font-bold text-teal-400">${slide.institution}</span>
              </div>
              <div class="flex items-center justify-between pt-1">
                <span class="text-slate-400">Live URL:</span>
                <a href="${slide.liveUrl}" target="_blank" class="font-bold text-teal-300 hover:underline">web1111-three.vercel.app</a>
              </div>
            </div>
          </div>
        `;
      }

      return ``;
    }

    function renderPresentation() {
      const data = presentationData[currentLang];
      const slide = data.slides[currentSlide];

      document.getElementById('slideCanvas').innerHTML = buildSlideHTML(slide, currentLang);
      document.getElementById('headerSub').textContent = data.headerSub;
      document.getElementById('langBtnText').textContent = data.langBtn;
      document.getElementById('downloadBtnText').textContent = data.downloadBtn;
      document.getElementById('prevBtnText').textContent = data.prevBtn;
      document.getElementById('nextBtnText').textContent = data.nextBtn;

      document.getElementById('slideCounter').textContent = `${currentSlide + 1} / ${data.slides.length}`;

      const dotsContainer = document.getElementById('dotsContainer');
      dotsContainer.innerHTML = data.slides.map((_, i) => `
        <button class="dot w-3 h-3 rounded-full shrink-0 transition-all ${i === currentSlide ? 'bg-teal-400 scale-125' : 'bg-slate-700'}" onclick="goToSlide(${i})"></button>
      `).join('');

      document.getElementById('prevBtn').disabled = currentSlide === 0;
      document.getElementById('nextBtn').disabled = currentSlide === data.slides.length - 1;
    }

    // INTERACTIVE SANDBOX DEMO HANDLERS
    window.handleDemoSearch = function(query) {
      const isAr = currentLang === 'ar';
      const results = document.getElementById('demoSearchResults');
      if (!results) return;

      const q = (query || '').toLowerCase();
      if (q.includes('concor')) {
        results.innerHTML = `
          <div class="flex items-center justify-between p-2 rounded-lg bg-slate-950 border border-teal-800/60">
            <div>
              <span class="font-bold text-teal-300 block text-sm">Concor 5mg Tablets</span>
              <span class="text-[11px] text-slate-400 font-mono">Bisoprolol Fumarate (Merck)</span>
            </div>
            <span class="text-[10px] bg-teal-950 text-teal-300 border border-teal-700 px-2 py-1 rounded font-bold">${isAr ? 'علاج الضغط ونبض القلب' : 'Beta Blocker'}</span>
          </div>
        `;
      } else if (q.includes('cataflam')) {
        results.innerHTML = `
          <div class="flex items-center justify-between p-2 rounded-lg bg-slate-950 border border-teal-800/60">
            <div>
              <span class="font-bold text-teal-300 block text-sm">Cataflam 50mg Tablets</span>
              <span class="text-[11px] text-slate-400 font-mono">Diclofenac Potassium (Novartis)</span>
            </div>
            <span class="text-[10px] bg-amber-950 text-amber-300 border border-amber-700 px-2 py-1 rounded font-bold">${isAr ? 'مسكن ومضاد التهاب' : 'NSAID Pain Reliever'}</span>
          </div>
        `;
      } else {
        results.innerHTML = `
          <div class="flex items-center justify-between p-2 rounded-lg bg-slate-950 border border-teal-800/60">
            <div>
              <span class="font-bold text-teal-300 block text-sm">Augmentin 1g Tablets</span>
              <span class="text-[11px] text-slate-400 font-mono">Amoxicillin + Clavulanic Acid (GSK)</span>
            </div>
            <span class="text-[10px] bg-teal-950 text-teal-300 border border-teal-700 px-2 py-1 rounded font-bold">${isAr ? 'مضاد واسع' : 'Broad Antibiotic'}</span>
          </div>
        `;
      }
    };

    window.setInteractionDemo = function(pair) {
      const isAr = currentLang === 'ar';
      const res = document.getElementById('interactionDemoResult');
      if (!res) return;

      if (pair === 'warfarin_cataflam') {
        res.innerHTML = `
          <span class="text-[10px] bg-red-600 text-white font-bold px-2 py-0.5 rounded uppercase">🔴 HIGH RISK (خطر نزيف حاد)</span>
          <h5 class="text-sm font-extrabold text-white">Warfarin ↔ Cataflam (Diclofenac)</h5>
          <p class="text-[11px] text-slate-300 leading-relaxed">
            ${isAr ? 'تنافس على بروتينات البلازما وتهتك بطانة المعدة يؤدي لنزيف داخلي حاد. التوصية: تجنب التزامن واستبدله بـ Panadol.' : 'Plasma protein displacement and gastric irritation causing severe hemorrhage. Action: Strictly avoid; substitute with Paracetamol.'}
          </p>
        `;
      } else if (pair === 'panadol_concor') {
        res.innerHTML = `
          <span class="text-[10px] bg-emerald-600 text-white font-bold px-2 py-0.5 rounded uppercase">🟢 SAFE (آمن تماماً)</span>
          <h5 class="text-sm font-extrabold text-white">Panadol (Paracetamol) ↔ Concor</h5>
          <p class="text-[11px] text-slate-300 leading-relaxed">
            ${isAr ? 'لا يوجد أي تعارض فارماكولوجي. مزيج آمن لمرضى الضغط.' : 'No pharmacological cross-interaction. Safe combination for hypertensive patients.'}
          </p>
        `;
      } else {
        res.innerHTML = `
          <span class="text-[10px] bg-red-600 text-white font-bold px-2 py-0.5 rounded uppercase">🔴 HIGH RISK (خطورة عالية)</span>
          <h5 class="text-sm font-extrabold text-white">Ciprofloxacin ↔ Antinal</h5>
          <p class="text-[11px] text-slate-300 leading-relaxed">
            ${isAr ? 'يحدث التصاق معوي يقلل امتصاص السيبروفلوكساسين بنسبة 60%. التوصية: فصل الجرعات بساعتين.' : 'Intestinal chelation reducing ciprofloxacin absorption by 60%. Action: Separate by 2 hours.'}
          </p>
        `;
      }
    };

    window.setFoodDemo = function(drug) {
      const isAr = currentLang === 'ar';
      const res = document.getElementById('foodDemoResult');
      if (!res) return;

      if (drug === 'glucophage') {
        res.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="font-bold text-emerald-300 text-xs">⏰ ${isAr ? 'الموعد: مع أو بعد الوجبة مباشرة' : 'Timing: With or Immediately After Meal'}</span>
            <span class="text-[10px] bg-emerald-950 border border-emerald-700 text-emerald-300 px-2 py-0.5 rounded font-bold">${isAr ? 'وسط الأكل' : 'With Food'}</span>
          </div>
          <div class="p-2 rounded-lg bg-amber-950/40 border border-amber-900/60 text-amber-300 text-[11px]">
            💡 <strong>${isAr ? 'السبب السريري:' : 'Clinical Rationale:'}</strong> ${isAr ? 'تقليل الاضطرابات المعوية والغثيان وتحسين استجابة الأنسولين.' : 'Reduces GI distress, nausea, and optimizes postprandial glucose uptake.'}
          </div>
        `;
      } else if (drug === 'concor') {
        res.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="font-bold text-teal-300 text-xs">⏰ ${isAr ? 'الموعد: صباحاً مع أو بدون طعام' : 'Timing: Morning with/without food'}</span>
            <span class="text-[10px] bg-teal-950 border border-teal-700 text-teal-300 px-2 py-0.5 rounded font-bold">${isAr ? 'موعد ثابت' : 'Fixed Time'}</span>
          </div>
          <div class="p-2 rounded-lg bg-slate-900 border border-slate-800 text-slate-300 text-[11px]">
            💡 <strong>${isAr ? 'إرشاد للمريض:' : 'Patient Tip:'}</strong> ${isAr ? 'تثبيت موعد الجرعة يومياً لتنظيم ضغط الدم على مدار 24 ساعة.' : 'Take at consistent time daily to maintain 24-hour blood pressure control.'}
          </div>
        `;
      } else {
        res.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="font-bold text-amber-300 text-xs">⏰ ${isAr ? 'الموعد: على معدة فارغة' : 'Timing: On Empty Stomach'}</span>
            <span class="text-[10px] bg-amber-950 border border-amber-700 text-amber-300 px-2 py-0.5 rounded font-bold">${isAr ? 'قبل الأكل بساعة' : '1h before meal'}</span>
          </div>
          <div class="p-2 rounded-lg bg-red-950/40 border border-red-900/60 text-red-300 text-[11px]">
            🚫 <strong>${isAr ? 'ممنوع تماماً:' : 'Strictly Avoid:'}</strong> ${isAr ? 'منتجات الألبان والكالسيوم وعصير الجريب فروت أثناء وقت الجرعة.' : 'Dairy, Calcium-rich foods, and Grapefruit juice.'}
          </div>
        `;
      }
    };

    window.calculateVitalsDemo = function(val) {
      const isAr = currentLang === 'ar';
      const res = document.getElementById('vitalsDemoResult');
      if (!res) return;

      const n = parseFloat(val);
      if (n <= 1.2) {
        res.innerHTML = `
          <span class="font-bold text-emerald-400 block">🟢 ${isAr ? 'النتيجة: طبيعي (Normal Range)' : 'Status: Normal (eGFR > 90)'}</span>
          <p class="text-[11px] text-slate-300">${isAr ? 'وظائف الكلى سليمة ولا تحتاج لتعديل جرعات.' : 'Normal renal function; standard dosing applicable.'}</p>
        `;
        res.className = 'p-3 rounded-xl bg-emerald-950/40 border border-emerald-800 text-xs space-y-1';
      } else {
        res.innerHTML = `
          <span class="font-bold text-red-400 block">🔴 ${isAr ? 'النتيجة: مرتفع (High / Renal Alert)' : 'Status: Elevated (Renal Alert)'}</span>
          <p class="text-[11px] text-slate-300">${isAr ? 'يشير لانخفاض وظائف الكلى (eGFR < 45). يلزم تعديل جرعات المضادات ومسكنات NSAIDs.' : 'Indicates reduced kidney function (eGFR < 45). Renal dose reduction required for antibiotics.'}</p>
        `;
        res.className = 'p-3 rounded-xl bg-red-950/40 border border-red-800 text-xs space-y-1';
      }
    };

    window.setChronicDemo = function(cond) {
      const isAr = currentLang === 'ar';
      const res = document.getElementById('chronicDemoResult');
      if (!res) return;

      if (cond === 'htn') {
        res.innerHTML = `
          <span class="font-bold text-amber-400 block">${isAr ? '🟠 تحذير وحذر شديد (Caution)' : '🟠 Caution Required'}</span>
          <p class="text-[11px] text-slate-300">
            ${isAr ? 'مسكنات NSAIDs ترفع ضغط الدم وتقلل فاعلية أدوية الضغط ACE/ARBs. لا يُستخدم لأكثر من 3 أيام.' : 'NSAIDs cause sodium retention, blunt antihypertensive therapy, and elevate systolic BP.'}
          </p>
        `;
      } else {
        res.innerHTML = `
          <span class="font-bold text-red-400 block">${isAr ? '🚫 ممنوع تماماً (Contraindicated)' : '🚫 Strictly Contraindicated'}</span>
          <p class="text-[11px] text-slate-300">
            ${isAr ? 'مسكنات NSAIDs تقلل تدفق الدم الكلوي وتفاقم القصور الكلوي. استبدله بالباراسيتامول (Panadol).' : 'NSAIDs reduce renal blood flow and precipitate acute renal failure. Substitute with Paracetamol.'}
          </p>
        `;
      }
    };

    function nextSlide() {
      const data = presentationData[currentLang];
      if (currentSlide < data.slides.length - 1) {
        currentSlide++;
        renderPresentation();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderPresentation();
      }
    }

    function goToSlide(index) {
      currentSlide = index;
      renderPresentation();
    }

    document.getElementById('nextBtn').addEventListener('click', nextSlide);
    document.getElementById('prevBtn').addEventListener('click', prevSlide);

    document.getElementById('langToggleBtn').addEventListener('click', () => {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      const root = document.getElementById('htmlRoot');
      if (currentLang === 'ar') {
        root.setAttribute('dir', 'rtl');
        root.setAttribute('lang', 'ar');
      } else {
        root.setAttribute('dir', 'ltr');
        root.setAttribute('lang', 'en');
      }
      renderPresentation();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown') {
        if (currentLang === 'ar') prevSlide(); else nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp' || e.key === ' ') {
        if (currentLang === 'ar') nextSlide(); else prevSlide();
      }
    });

    renderPresentation();
  </script>
</body>
</html>
